<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <style>
      .petal { fill: none; stroke: #ffffff; stroke-width: 2; }
    </style>
  </defs>
  <!-- Organic bloom / flower shape made of overlapping ellipses -->
  <ellipse class="petal" cx="150" cy="150" rx="60" ry="110" transform="rotate(0 150 150)"/>
  <ellipse class="petal" cx="150" cy="150" rx="60" ry="110" transform="rotate(30 150 150)"/>
  <ellipse class="petal" cx="150" cy="150" rx="60" ry="110" transform="rotate(60 150 150)"/>
  <ellipse class="petal" cx="150" cy="150" rx="60" ry="110" transform="rotate(90 150 150)"/>
  <ellipse class="petal" cx="150" cy="150" rx="60" ry="110" transform="rotate(120 150 150)"/>
  <ellipse class="petal" cx="150" cy="150" rx="60" ry="110" transform="rotate(150 150 150)"/>
  <circle cx="150" cy="150" r="20" fill="none" stroke="#ffffff" stroke-width="2"/>
  <!-- Outer ring of small circles -->
  <circle cx="150" cy="40" r="6" fill="#ffffff"/>
  <circle cx="225" cy="82" r="5" fill="#ffffff"/>
  <circle cx="258" cy="164" r="6" fill="#ffffff"/>
  <circle cx="213" cy="243" r="5" fill="#ffffff"/>
  <circle cx="132" cy="264" r="6" fill="#ffffff"/>
  <circle cx="60" cy="220" r="5" fill="#ffffff"/>
  <circle cx="36" cy="140" r="6" fill="#ffffff"/>
  <circle cx="74" cy="68" r="5" fill="#ffffff"/>
</svg>
