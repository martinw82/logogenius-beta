<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <!-- Radial starburst with long and short rays -->
  <!-- Long rays (every 30°) -->
  <line x1="150" y1="150" x2="150" y2="10" stroke="#ffffff" stroke-width="3"/>
  <line x1="150" y1="150" x2="220" y2="36" stroke="#ffffff" stroke-width="3"/>
  <line x1="150" y1="150" x2="264" y2="115" stroke="#ffffff" stroke-width="3"/>
  <line x1="150" y1="150" x2="280" y2="195" stroke="#ffffff" stroke-width="3"/>
  <line x1="150" y1="150" x2="234" y2="264" stroke="#ffffff" stroke-width="3"/>
  <line x1="150" y1="150" x2="150" y2="290" stroke="#ffffff" stroke-width="3"/>
  <line x1="150" y1="150" x2="66" y2="264" stroke="#ffffff" stroke-width="3"/>
  <line x1="150" y1="150" x2="20" y2="195" stroke="#ffffff" stroke-width="3"/>
  <line x1="150" y1="150" x2="36" y2="115" stroke="#ffffff" stroke-width="3"/>
  <line x1="150" y1="150" x2="80" y2="36" stroke="#ffffff" stroke-width="3"/>
  <line x1="150" y1="150" x2="150" y2="10" stroke="#ffffff" stroke-width="3"/>
  <!-- Short rays (every 30°, offset 15°) -->
  <line x1="150" y1="150" x2="188" y2="20" stroke="#ffffff" stroke-width="1.5"/>
  <line x1="150" y1="150" x2="252" y2="73" stroke="#ffffff" stroke-width="1.5"/>
  <line x1="150" y1="150" x2="278" y2="152" stroke="#ffffff" stroke-width="1.5"/>
  <line x1="150" y1="150" x2="255" y2="230" stroke="#ffffff" stroke-width="1.5"/>
  <line x1="150" y1="150" x2="195" y2="280" stroke="#ffffff" stroke-width="1.5"/>
  <line x1="150" y1="150" x2="112" y2="280" stroke="#ffffff" stroke-width="1.5"/>
  <line x1="150" y1="150" x2="45" y2="230" stroke="#ffffff" stroke-width="1.5"/>
  <line x1="150" y1="150" x2="22" y2="152" stroke="#ffffff" stroke-width="1.5"/>
  <line x1="150" y1="150" x2="48" y2="73" stroke="#ffffff" stroke-width="1.5"/>
  <line x1="150" y1="150" x2="112" y2="20" stroke="#ffffff" stroke-width="1.5"/>
  <!-- Center circles -->
  <circle cx="150" cy="150" r="25" fill="none" stroke="#ffffff" stroke-width="2.5"/>
  <circle cx="150" cy="150" r="12" fill="none" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="150" cy="150" r="4" fill="#ffffff"/>
  <!-- Outer ring -->
  <circle cx="150" cy="150" r="120" fill="none" stroke="#ffffff" stroke-width="0.8" stroke-dasharray="4,8"/>
</svg>
