<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <pattern id="diagonalGrid" width="40" height="40" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="40" stroke="black" stroke-width="1.5" opacity="0.2"/>
      <line x1="0" y1="0" x2="40" y2="0" stroke="black" stroke-width="1.5" opacity="0.2"/>
    </pattern>
  </defs>
  <rect width="200" height="200" fill="url(#diagonalGrid)"/>
</svg>