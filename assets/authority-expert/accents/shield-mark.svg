<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <!-- Heraldic shield / crest geometric shape -->
  <!-- Main shield outline -->
  <path d="M150 20 L270 60 L270 160 C270 220 210 270 150 290 C90 270 30 220 30 160 L30 60 Z"
        fill="none" stroke="#ffffff" stroke-width="3"/>
  <!-- Inner shield -->
  <path d="M150 45 L248 78 L248 160 C248 210 198 252 150 268 C102 252 52 210 52 160 L52 78 Z"
        fill="none" stroke="#ffffff" stroke-width="1.5"/>
  <!-- Horizontal divider -->
  <line x1="30" y1="130" x2="270" y2="130" stroke="#ffffff" stroke-width="1.5"/>
  <!-- Vertical divider -->
  <line x1="150" y1="20" x2="150" y2="290" stroke="#ffffff" stroke-width="1.5"/>
  <!-- Top-left quadrant: horizontal lines -->
  <line x1="35" y1="90" x2="145" y2="90" stroke="#ffffff" stroke-width="0.8"/>
  <line x1="35" y1="108" x2="145" y2="108" stroke="#ffffff" stroke-width="0.8"/>
  <!-- Top-right quadrant: diagonal lines -->
  <line x1="155" y1="60" x2="268" y2="125" stroke="#ffffff" stroke-width="0.8"/>
  <line x1="155" y1="78" x2="268" y2="108" stroke="#ffffff" stroke-width="0.8"/>
  <!-- Center crown symbol -->
  <path d="M130 120 L130 105 L140 115 L150 100 L160 115 L170 105 L170 120 Z"
        fill="#ffffff" opacity="0.8"/>
  <!-- Bottom shield text line -->
  <rect x="100" y="240" width="100" height="18" fill="none" stroke="#ffffff" stroke-width="1"/>
  <line x1="105" y1="248" x2="195" y2="248" stroke="#ffffff" stroke-width="0.6"/>
</svg>
