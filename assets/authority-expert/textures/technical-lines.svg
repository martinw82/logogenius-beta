<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1120" width="800" height="1120">
  <defs>
    <style>line { stroke: #ffffff; }</style>
  </defs>
  <!-- Fine technical diagonal grid — precise 30-degree angles -->
  <!-- Primary diagonals (30°) -->
  <line x1="-120" y1="0" x2="120" y2="1120" stroke-width="0.6"/>
  <line x1="-60" y1="0" x2="180" y2="1120" stroke-width="0.3"/>
  <line x1="0" y1="0" x2="240" y2="1120" stroke-width="0.6"/>
  <line x1="60" y1="0" x2="300" y2="1120" stroke-width="0.3"/>
  <line x1="120" y1="0" x2="360" y2="1120" stroke-width="0.6"/>
  <line x1="180" y1="0" x2="420" y2="1120" stroke-width="0.3"/>
  <line x1="240" y1="0" x2="480" y2="1120" stroke-width="0.6"/>
  <line x1="300" y1="0" x2="540" y2="1120" stroke-width="0.3"/>
  <line x1="360" y1="0" x2="600" y2="1120" stroke-width="0.6"/>
  <line x1="420" y1="0" x2="660" y2="1120" stroke-width="0.3"/>
  <line x1="480" y1="0" x2="720" y2="1120" stroke-width="0.6"/>
  <line x1="540" y1="0" x2="780" y2="1120" stroke-width="0.3"/>
  <line x1="600" y1="0" x2="840" y2="1120" stroke-width="0.6"/>
  <line x1="660" y1="0" x2="900" y2="1120" stroke-width="0.3"/>
  <line x1="720" y1="0" x2="960" y2="1120" stroke-width="0.6"/>
  <line x1="780" y1="0" x2="1020" y2="1120" stroke-width="0.3"/>
  <!-- Horizontal reference lines (lighter) -->
  <line x1="0" y1="0" x2="800" y2="0" stroke-width="1"/>
  <line x1="0" y1="160" x2="800" y2="160" stroke-width="0.4"/>
  <line x1="0" y1="320" x2="800" y2="320" stroke-width="1"/>
  <line x1="0" y1="480" x2="800" y2="480" stroke-width="0.4"/>
  <line x1="0" y1="640" x2="800" y2="640" stroke-width="1"/>
  <line x1="0" y1="800" x2="800" y2="800" stroke-width="0.4"/>
  <line x1="0" y1="960" x2="800" y2="960" stroke-width="1"/>
  <line x1="0" y1="1120" x2="800" y2="1120" stroke-width="0.4"/>
  <!-- Cross-hatch dots at intersections -->
  <circle cx="0" cy="0" r="2" fill="#ffffff"/>
  <circle cx="240" cy="0" r="2" fill="#ffffff"/>
  <circle cx="480" cy="0" r="2" fill="#ffffff"/>
  <circle cx="720" cy="0" r="2" fill="#ffffff"/>
  <circle cx="120" cy="560" r="2" fill="#ffffff"/>
  <circle cx="360" cy="560" r="2" fill="#ffffff"/>
  <circle cx="600" cy="560" r="2" fill="#ffffff"/>
</svg>
