<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <!-- T-shirt body (light gray) -->
  <path d="M 50 80 L 80 20 L 100 20 L 140 80 L 140 480 L 260 480 L 260 80 L 300 20 L 320 20 L 350 80 L 350 480 Q 350 490 340 490 L 60 490 Q 50 490 50 480 Z"
        fill="#e8e8e8" stroke="#999999" stroke-width="1"/>

  <!-- Left sleeve -->
  <ellipse cx="80" cy="80" rx="50" ry="40" fill="#e8e8e8" stroke="#999999" stroke-width="1"/>

  <!-- Right sleeve -->
  <ellipse cx="320" cy="80" rx="50" ry="40" fill="#e8e8e8" stroke="#999999" stroke-width="1"/>

  <!-- Neckline -->
  <path d="M 150 80 Q 200 120 250 80" fill="none" stroke="#999999" stroke-width="1"/>

  <!-- Logo placement area (centered, large) -->
  <g id="logo-container">
    <!-- Placeholder for logo -->
    <rect x="125" y="180" width="150" height="150" fill="#f5f5f5" stroke="#cccccc" stroke-width="2" stroke-dasharray="5,5" rx="5"/>
    <text x="200" y="260" font-family="Arial, sans-serif" font-size="14" fill="#999999" text-anchor="middle" font-weight="bold">
      Logo Here
    </text>
    <text x="200" y="280" font-family="Arial, sans-serif" font-size="11" fill="#bbbbbb" text-anchor="middle">
      (Centered)
    </text>
  </g>

  <!-- Shirt details -->
  <line x1="200" y1="80" x2="200" y2="480" stroke="#d0d0d0" stroke-width="1"/>

  <!-- Care instructions area (bottom) -->
  <text x="200" y="440" font-family="Arial, sans-serif" font-size="10" fill="#999999" text-anchor="middle">
    100% Premium Cotton
  </text>
</svg>
